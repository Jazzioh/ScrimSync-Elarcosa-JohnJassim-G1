{% extends "base.html" %}
{% block title %}Disband Team | ScrimSync{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h4 class="card-title text-danger mb-3">Disband Team</h4>
                <p>Are you sure you want to delete <strong>[{{ object.tag }}] {{ object.name }}</strong>? All hosted scrimmage records for this team will also be removed.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Confirm Disband</button>
                        <a href="{% url 'scrims:team_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
